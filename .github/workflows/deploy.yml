name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run replaces a pending one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npx eslint .

      # basePath has to match the repository name, because a project page is served from
      # https://<user>.github.io/<repo>/ rather than the domain root.
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Without this, GitHub Pages runs Jekyll, which ignores every directory starting with
      # an underscore — including Next's `_next`, i.e. all the JavaScript and CSS.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
